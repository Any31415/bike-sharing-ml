name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

jobs:
  functional-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Pull Docker image
        run: docker pull ani31415/bike-sharing-api:latest

      - name: Run container
        run: docker run -d -p 8000:8000 --name test-container ani31415/bike-sharing-api:latest

      - name: Wait for API to start
        run: sleep 10

      - name: Health check
        run: curl -f http://localhost:8000/ || exit 1

      - name: Test prediction endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"season":3,"holiday":0,"workingday":1,"weather":1,"temp":25,"humidity":55,"windspeed":8,"hour":8,"dayofweek":2,"month":7}' \
            || exit 1

      - name: Stop container
        if: always()
        run: docker stop test-container